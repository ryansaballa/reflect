<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Reflection Journal</title>
  </head>
  <body>
    <main class="container">
      <h1>Focus on Three Questions</h1>
      <p>Create open-ended questions that align with your goals:</p>

      <ol>
        <li><input type="text" id="q1" placeholder="Question 1" /></li>
        <li><input type="text" id="q2" placeholder="Question 2" /></li>
        <li><input type="text" id="q3" placeholder="Question 3" /></li>
      </ol>

      <button id="startBtn">Start Journaling</button>
    </main>

    <script>
      // Questions editable when user goes back

      document.addEventListener("DOMContentLoaded", () => {
        const savedQuestions =
          JSON.parse(localStorage.getItem("journalQuestions")) || []

        if (savedQuestions.length) {
          document.getElementById("q1").value = savedQuestions[0].question || ""
          document.getElementById("q2").value = savedQuestions[1].question || ""
          document.getElementById("q3").value = savedQuestions[2].question || ""
        }
      })
      document.getElementById("startBtn").addEventListener("click", () => {
        const questions = [
          { question: document.getElementById("q1").value.trim() },
          { question: document.getElementById("q2").value.trim() },
          { question: document.getElementById("q3").value.trim() },
        ]

        // Basic validation
        if (questions.some((q) => q.question === "")) {
          alert("Please fill in all 3 questions.")
          return
        }

        // Save to localStorage
        localStorage.setItem("journalQuestions", JSON.stringify(questions))

        // Redirect to main journal page
        window.location.href = "prompts.html"
      })
    </script>
  </body>
</html>
